y="Arial, sans-serif" font-size="13" fill="#65766f">test boundary</text><rect x="795.0" y="105" width="150.0" height="80" rx="12" fill="#ffffff" stroke="#0b4f38" stroke-width="2"/><text x="870.0" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#16322a">Load / section</text><text x="870.0" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#16322a">suspect</text><text x="870.0" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#65766f">separate open / short / load</text><text x="500" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#65766f">Use the labels to explain cause → observation, not just memorize the picture.</text></svg>