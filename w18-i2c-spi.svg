<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">w18 i2c spi</title><desc id="d">Instructional diagram for w18 i2c spi.</desc><rect width="1000" height="360" rx="18" fill="#fbf8ef"/><rect x="18" y="18" width="964" height="324" rx="14" fill="none" stroke="#0b4f38" stroke-width="3"/><rect x="52.5" y="90" width="205" height="105" rx="12" fill="#fff" stroke="#0b4f38" stroke-width="2"/><text x="155.0" y="125" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#16322a">I²C: SDA/SCL open-drain</text><text x="155.0" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#65766f">pull-ups create HIGH</text><rect x="282.5" y="90" width="205" height="105" rx="12" fill="#fff" stroke="#0b4f38" stroke-width="2"/><text x="385.0" y="125" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#16322a">START + address + ACK</text><text x="385.0" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#65766f">addressed shared bus</text><rect x="512.5" y="90" width="205" height="105" rx="12" fill="#fff" stroke="#0b4f38" stroke-width="2"/><text x="615.0" y="125" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#16322a">SPI: SCLK/MOSI/MISO/CS</text><text x="615.0" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#65766f">push-pull usually</text><rect x="742.5" y="90" width="205" height="105" rx="12" fill="#fff" stroke="#0b4f38" stroke-width="2"/><text x="845.0" y="125" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#16322a">Mode CPOL/CPHA</text><text x="845.0" y="160" text-anchor="middle" font-family="Arial" font-size="14" fill="#65766f">edge/phase must match</text><text x="500" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#65766f">Use the labels to explain cause → observation, not just memorize the picture.</text></svg>