<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Probe and channel mismatch</title><desc id="d">An independently known 2.0 volt peak-to-peak one kilohertz source feeds a physical ten-times probe. The oscilloscope is mistakenly set to one-times and reports 0.20 volts peak-to-peak. A cycle spans five divisions at 0.2 milliseconds per division.</desc><rect width="900" height="360" rx="16" fill="#f5f8f6"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#225745"/></marker></defs><g font-family="Arial,sans-serif" fill="#193c32"><text x="25" y="36" font-size="23" text-anchor="start">Probe attenuation and the displayed measurement</text><rect x="30" y="105" width="215" height="100" rx="12" fill="white" stroke="#94b4a5" stroke-width="2"/><text x="137.5" y="143" font-size="19" text-anchor="middle">Known source</text><text x="137.5" y="179" font-size="16" text-anchor="middle">2.0 Vpp · 1 kHz</text><rect x="330" y="105" width="205" height="100" rx="12" fill="white" stroke="#94b4a5" stroke-width="2"/><text x="432.5" y="143" font-size="19" text-anchor="middle">Physical 10× probe</text><text x="432.5" y="179" font-size="16" text-anchor="middle">Voltage divided by 10</text><rect x="620" y="105" width="250" height="100" rx="12" fill="white" stroke="#94b4a5" stroke-width="2"/><text x="745.0" y="143" font-size="19" text-anchor="middle">Scope set to 1×</text><text x="745.0" y="179" font-size="16" text-anchor="middle">Readout 0.20 Vpp</text><path d="M248 155 L324 155" stroke="#225745" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M538 155 L614 155" stroke="#225745" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="32" y="260" font-size="19" text-anchor="start">Timebase evidence — one cycle spans 5 divisions at 0.2 ms/div.</text><text x="32" y="304" font-size="17" text-anchor="start">Explain the low readout. Predict the display when probe and channel settings match.</text></g></svg>