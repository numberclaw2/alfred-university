<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">w23 readiness gate</title><desc id="d">Instructional diagram for w23 readiness gate.</desc><rect width="1000" height="360" rx="18" fill="#fbf8ef"/><rect x="18" y="18" width="964" height="324" rx="14" fill="none" stroke="#0b4f38" stroke-width="3"/><line x1="205.0" y1="145" x2="231.0" y2="145" stroke="#0b4f38" stroke-width="4"/><polygon points="231.0,139 241.0,145 231.0,151" fill="#0b4f38"/><rect x="55.0" y="105" width="150.0" height="80" rx="12" fill="#ffffff" stroke="#0b4f38" stroke-width="2"/><text x="130.0" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#16322a">Practice run #1</text><text x="130.0" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#16322a">≥85</text><text x="130.0" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#65766f">current 100Q</text><line x1="390.0" y1="145" x2="416.0" y2="145" stroke="#0b4f38" stroke-width="4"/><polygon points="416.0,139 426.0,145 416.0,151" fill="#0b4f38"/><rect x="240.0" y="105" width="150.0" height="80" rx="12" fill="#ffffff" stroke="#0b4f38" stroke-width="2"/><text x="315.0" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#16322a">repair weak rows</text><text x="315.0" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#65766f">critical safety 100%</text><line x1="575.0" y1="145" x2="601.0" y2="145" stroke="#0b4f38" stroke-width="4"/><polygon points="601.0,139 611.0,145 601.0,151" fill="#0b4f38"/><rect x="425.0" y="105" width="150.0" height="80" rx="12" fill="#ffffff" stroke="#0b4f38" stroke-width="2"/><text x="500.0" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#16322a">fresh delay</text><text x="500.0" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#65766f">avoid memorization</text><line x1="760.0" y1="145" x2="786.0" y2="145" stroke="#0b4f38" stroke-width="4"/><polygon points="786.0,139 796.0,145 786.0,151" fill="#0b4f38"/><rect x="610.0" y="105" width="150.0" height="80" rx="12" fill="#ffffff" stroke="#0b4f38" stroke-width="2"/><text x="685.0" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#16322a">Practice run #2</text><text x="685.0" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#16322a">≥85</text><text x="685.0" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#65766f">separate form/run</text><rect x="795.0" y="105" width="150.0" height="80" rx="12" fill="#ffffff" stroke="#0b4f38" stroke-width="2"/><text x="870.0" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#16322a">readiness decision</text><text x="870.0" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#65766f">not a guarantee</text><text x="500" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#65766f">Use the labels to explain cause → observation, not just memorize the picture.</text></svg>