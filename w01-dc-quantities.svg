<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">w01 dc quantities</title><desc id="d">Instructional diagram for w01 dc quantities.</desc><rect width="1000" height="360" rx="18" fill="#fbf8ef"/><rect x="18" y="18" width="964" height="324" rx="14" fill="none" stroke="#0b4f38" stroke-width="3"/><text x="55" y="65" font-family="Arial" font-size="23" font-weight="700" fill="#0b4f38">W01 Dc Quantities</text><text x="70" y="110" font-family="Arial" font-size="16" font-weight="700" fill="#16322a">9 V source</text><line x1="300" y1="104" x2="900" y2="104" stroke="#d6dfda" stroke-width="2"/><line x1="330" y1="104" x2="870" y2="104" stroke="#c8a951" stroke-width="4"/><circle cx="600" cy="104" r="9" fill="#0b4f38"/><text x="330" y="135" font-family="Arial" font-size="13" fill="#65766f">V across</text><text x="70" y="164" font-family="Arial" font-size="16" font-weight="700" fill="#16322a">1 kΩ resistor</text><line x1="300" y1="158" x2="900" y2="158" stroke="#d6dfda" stroke-width="2"/><line x1="330" y1="158" x2="870" y2="158" stroke="#c8a951" stroke-width="4"/><circle cx="600" cy="158" r="9" fill="#0b4f38"/><text x="330" y="189" font-family="Arial" font-size="13" fill="#65766f">I through</text><text x="70" y="218" font-family="Arial" font-size="16" font-weight="700" fill="#16322a">I = 9 mA</text><line x1="300" y1="212" x2="900" y2="212" stroke="#d6dfda" stroke-width="2"/><line x1="330" y1="212" x2="870" y2="212" stroke="#c8a951" stroke-width="4"/><circle cx="600" cy="212" r="9" fill="#0b4f38"/><text x="330" y="243" font-family="Arial" font-size="13" fill="#65766f">R limits</text><text x="70" y="272" font-family="Arial" font-size="16" font-weight="700" fill="#16322a">P = 81 mW</text><line x1="300" y1="266" x2="900" y2="266" stroke="#d6dfda" stroke-width="2"/><line x1="330" y1="266" x2="870" y2="266" stroke="#c8a951" stroke-width="4"/><circle cx="600" cy="266" r="9" fill="#0b4f38"/><text x="330" y="297" font-family="Arial" font-size="13" fill="#65766f">P becomes heat</text><text x="500" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#65766f">Use the labels to explain cause → observation, not just memorize the picture.</text></svg>