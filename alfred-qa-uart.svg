<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="t d"><title id="t">UART frame carrying 0x53</title><desc id="d">One non-inverted frame. Idle high, start low, then 1 1 0 0 1 0 1 0 in time order and a high stop. The ten character intervals occupy 1.042 milliseconds.</desc><rect width="760" height="230" rx="12" fill="#f5f8f6"/><g font-family="system-ui, sans-serif" fill="#153c38"><text x="25" y="31" text-anchor="start" font-size="20" font-weight="700">Logic-level UART</text><text x="735" y="31" text-anchor="end" font-size="13">9,600 bit/s · 8-N-1 · time increases to the right</text><text x="53" y="90" text-anchor="end" font-size="12">HIGH</text><text x="53" y="134" text-anchor="end" font-size="12">LOW</text><path d="M 65 66 V 150" stroke="#9baea7" stroke-dasharray="3 4"/><text x="94.5" y="59" text-anchor="middle" font-size="14" font-weight="700">idle</text><text x="94.5" y="168" text-anchor="middle" font-size="14">1</text><path d="M 124 66 V 150" stroke="#9baea7" stroke-dasharray="3 4"/><text x="153.5" y="59" text-anchor="middle" font-size="14" font-weight="700">start</text><text x="153.5" y="168" text-anchor="middle" font-size="14">0</text><path d="M 183 66 V 150" stroke="#9baea7" stroke-dasharray="3 4"/><text x="212.5" y="59" text-anchor="middle" font-size="14" font-weight="700">D0</text><text x="212.5" y="168" text-anchor="middle" font-size="14">1</text><path d="M 242 66 V 150" stroke="#9baea7" stroke-dasharray="3 4"/><text x="271.5" y="59" text-anchor="middle" font-size="14" font-weight="700">D1</text><text x="271.5" y="168" text-anchor="middle" font-size="14">1</text><path d="M 301 66 V 150" stroke="#9baea7" stroke-dasharray="3 4"/><text x="330.5" y="59" text-anchor="middle" font-size="14" font-weight="700">D2</text><text x="330.5" y="168" text-anchor="middle" font-size="14">0</text><path d="M 360 66 V 150" stroke="#9baea7" stroke-dasharray="3 4"/><text x="389.5" y="59" text-anchor="middle" font-size="14" font-weight="700">D3</text><text x="389.5" y="168" text-anchor="middle" font-size="14">0</text><path d="M 419 66 V 150" stroke="#9baea7" stroke-dasharray="3 4"/><text x="448.5" y="59" text-anchor="middle" font-size="14" font-weight="700">D4</text><text x="448.5" y="168" text-anchor="middle" font-size="14">1</text><path d="M 478 66 V 150" stroke="#9baea7" stroke-dasharray="3 4"/><text x="507.5" y="59" text-anchor="middle" font-size="14" font-weight="700">D5</text><text x="507.5" y="168" text-anchor="middle" font-size="14">0</text><path d="M 537 66 V 150" stroke="#9baea7" stroke-dasharray="3 4"/><text x="566.5" y="59" text-anchor="middle" font-size="14" font-weight="700">D6</text><text x="566.5" y="168" text-anchor="middle" font-size="14">1</text><path d="M 596 66 V 150" stroke="#9baea7" stroke-dasharray="3 4"/><text x="625.5" y="59" text-anchor="middle" font-size="14" font-weight="700">D7</text><text x="625.5" y="168" text-anchor="middle" font-size="14">0</text><path d="M 655 66 V 150" stroke="#9baea7" stroke-dasharray="3 4"/><text x="684.5" y="59" text-anchor="middle" font-size="14" font-weight="700">stop</text><text x="684.5" y="168" text-anchor="middle" font-size="14">1</text><path d="M 65 84 V 84 H 124 V 128 H 183 V 84 H 242 V 84 H 301 V 128 H 360 V 128 H 419 V 84 H 478 V 128 H 537 V 84 H 596 V 128 H 655 V 84 H 714" fill="none" stroke="#165b50" stroke-width="4"/><path d="M 124 180 v8 h59 v-8" fill="none" stroke="#526b64" stroke-width="2"/><text x="153.5" y="207" text-anchor="middle" font-size="12">104.2 µs</text><text x="730" y="207" text-anchor="end" font-size="13">Time axis · one cell equals one bit interval</text></g></svg>
