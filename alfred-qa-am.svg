<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="t d"><title id="t">Ideal conventional AM spectrum</title><desc id="d">Ideal 1 MHz carrier with two single-tone sidebands 2 kHz away. Relative voltage amplitudes 0.25, 1, 0.25 at 998, 1000 and 1002 kHz.</desc><rect width="760" height="230" rx="12" fill="#f5f8f6"/><g font-family="system-ui, sans-serif" fill="#153c38"><text x="24" y="31" text-anchor="start" font-size="20" font-weight="700">Ideal single-tone AM</text><text x="734" y="31" text-anchor="end" font-size="13">Carrier present · 50% modulation</text><text x="70" y="60" text-anchor="start" font-size="13">Relative voltage amplitude</text><path d="M 90 78 H 698" stroke="#c5d3cb" stroke-dasharray="3 4"/><text x="78" y="83" text-anchor="end" font-size="13">1</text><path d="M 90 121 H 698" stroke="#c5d3cb" stroke-dasharray="3 4"/><text x="78" y="126" text-anchor="end" font-size="13">0.5</text><path d="M 90 142.5 H 698" stroke="#c5d3cb" stroke-dasharray="3 4"/><text x="78" y="147.5" text-anchor="end" font-size="13">0.25</text><path d="M 90 164 H 698" stroke="#c5d3cb" stroke-dasharray="3 4"/><text x="78" y="169" text-anchor="end" font-size="13">0</text><path d="M 90 70 V 164 H 702" fill="none" stroke="#456158" stroke-width="1.7"/><path d="M 197 163 V 142.5" stroke="#146553" stroke-width="4"/><circle cx="197" cy="142.5" r="4.5" fill="#146553"/><text x="197" y="187" text-anchor="middle" font-size="14" font-weight="700">998</text><path d="M 394 163 V 78" stroke="#146553" stroke-width="4"/><circle cx="394" cy="78" r="4.5" fill="#146553"/><text x="394" y="187" text-anchor="middle" font-size="14" font-weight="700">1000</text><path d="M 591 163 V 142.5" stroke="#146553" stroke-width="4"/><circle cx="591" cy="142.5" r="4.5" fill="#146553"/><text x="591" y="187" text-anchor="middle" font-size="14" font-weight="700">1002</text><text x="394" y="216" text-anchor="middle" font-size="15">Frequency (kHz)</text></g></svg>
