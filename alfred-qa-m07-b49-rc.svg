<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">Low-voltage resistor-capacitor charging circuit with an open switch</title>
<desc id="desc">A complete closed electrical return path contains a five-volt isolated DC source at left, an open switch followed by a ten-kilohm resistor along the upper conductor, and a one-microfarad nonpolar capacitor from the right node to common return. After the switch closes, current charges the capacitor. Capacitor voltage Vc is measured across it. The ideal RC time constant is ten milliseconds.</desc>
<rect width="960" height="510" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#1c3345"><text x="40" y="50" font-size="25" font-weight="700">RC charging circuit — isolated 5 V trainer</text><text x="40" y="81" font-size="17">Switch drawn open; close to begin charging from 0 V</text></g>
<g fill="none" stroke="#1c3345" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
<!-- supply and lower return -->
<path d="M155 145 V199 M155 301 V418 H710 V304"/>
<circle cx="155" cy="250" r="51"/>
<path d="M155 145 H270 M355 145 H430"/>
<!-- switch -->
<circle cx="270" cy="145" r="7" fill="#ffffff"/><circle cx="355" cy="145" r="7" fill="#ffffff"/><path d="M274 143 L338 111"/>
<!-- resistor -->
<path d="M430 145 l17 -26 l25 52 l25 -52 l25 52 l25 -26 H710 V234"/>
<!-- capacitor plates -->
<path d="M654 234 H766 M654 267 H766 M710 267 V304"/>
<!-- voltage rail from source upper path already connected -->
</g>
<g font-family="Arial, Helvetica, sans-serif" fill="#1c3345" font-size="22">
<text x="144" y="241" font-size="27">+</text><text x="148" y="283" font-size="30">−</text>
<text x="32" y="341" font-size="19">5.0 V DC</text><text x="32" y="366" font-size="16">isolated</text>
<text x="288" y="96" font-size="19">S1</text>
<text x="475" y="96" font-size="20">R = 10 kΩ</text>
<text x="780" y="244" font-size="21">C = 1 µF</text>
<text x="780" y="270" font-size="17">nonpolar</text>
<text x="382" y="463" font-size="19">Common 0 V return</text>
<text x="40" y="484" font-size="19" font-weight="700">τ = RC = 10 ms</text>
</g>
<g stroke="#147d89" stroke-width="4" fill="none" stroke-linecap="round">
<path d="M876 235 V272"/><path d="M868 243 l8 -8 l8 8 M868 264 l8 8 l8 -8"/>
</g><text x="886" y="259" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#147d89">V<tspan baseline-shift="sub" font-size="15">C</tspan></text>
</svg>
