<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Node current reference arrows</title><desc id="d">One point connects four branches. Currents of 1.8 and 2.6 milliamperes enter. A current of 4.7 milliamperes and unknown Ix are referenced outward.</desc><rect width="900" height="360" rx="16" fill="#f5f8f6"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#225745"/></marker></defs><g font-family="Arial,sans-serif" fill="#193c32"><text x="30" y="35" font-size="23" text-anchor="start">Current balance — keep the reference arrows</text><path d="M120 175 L426 175" stroke="#225745" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M440 80 L440 161" stroke="#225745" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M454 175 L760 175" stroke="#225745" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M440 189 L440 282" stroke="#225745" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="440" cy="175" r="10" fill="#147660"/><text x="165" y="150" font-size="18" text-anchor="start">1.8 mA entering</text><text x="463" y="110" font-size="18" text-anchor="start">2.6 mA entering</text><text x="550" y="150" font-size="18" text-anchor="start">4.7 mA leaving</text><text x="465" y="250" font-size="18" text-anchor="start">Ix assumed leaving</text><text x="30" y="325" font-size="19" text-anchor="start">Find Ix. If it is negative, explain the actual current direction.</text></g></svg>