<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Open and closed low-voltage circuit</title><desc id="d">Two identical 9 volt sources and 3 kilohm resistors. The left series switch is open, and the right switch is closed. Predict loop current and charge moved in twenty seconds.</desc><rect width="900" height="360" rx="16" fill="#f5f8f6"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#225745"/></marker></defs><g font-family="Arial,sans-serif" fill="#193c32"><text x="30" y="32" font-size="23" text-anchor="start">Ideal switched circuit — compare the two states</text><text x="50" y="70" font-size="20" text-anchor="start">Switch open</text><path d="M80 130 L180 130" stroke="#225745" stroke-width="3" fill="none"/><path d="M240 130 L280 130" stroke="#225745" stroke-width="3" fill="none"/><path d="M360 130 L400 130" stroke="#225745" stroke-width="3" fill="none"/><path d="M400 130 L400 270" stroke="#225745" stroke-width="3" fill="none"/><path d="M400 270 L80 270" stroke="#225745" stroke-width="3" fill="none"/><path d="M80 130 L80 170" stroke="#225745" stroke-width="3" fill="none"/><path d="M80 230 L80 270" stroke="#225745" stroke-width="3" fill="none"/><circle cx="80" cy="200" r="30" stroke="#225745" stroke-width="3" fill="white"/><text x="80" y="193" font-size="18" text-anchor="middle">+</text><text x="80" y="220" font-size="18" text-anchor="middle">−</text><text x="124" y="207" font-size="18" text-anchor="start">9 V</text><rect x="280" y="115" width="80" height="30" fill="white" stroke="#225745" stroke-width="3"/><text x="320" y="104" font-size="18" text-anchor="middle">3.0 kΩ</text><path d="M180 130 L240 99" stroke="#225745" stroke-width="3" fill="none"/><circle cx="180" cy="130" r="4"/><circle cx="240" cy="130" r="4"/><text x="50" y="316" font-size="16" text-anchor="start">Find loop current and charge moved in 20 s.</text><text x="490" y="70" font-size="20" text-anchor="start">Switch closed</text><path d="M520 130 L620 130" stroke="#225745" stroke-width="3" fill="none"/><path d="M680 130 L720 130" stroke="#225745" stroke-width="3" fill="none"/><path d="M800 130 L840 130" stroke="#225745" stroke-width="3" fill="none"/><path d="M840 130 L840 270" stroke="#225745" stroke-width="3" fill="none"/><path d="M840 270 L520 270" stroke="#225745" stroke-width="3" fill="none"/><path d="M520 130 L520 170" stroke="#225745" stroke-width="3" fill="none"/><path d="M520 230 L520 270" stroke="#225745" stroke-width="3" fill="none"/><circle cx="520" cy="200" r="30" stroke="#225745" stroke-width="3" fill="white"/><text x="520" y="193" font-size="18" text-anchor="middle">+</text><text x="520" y="220" font-size="18" text-anchor="middle">−</text><text x="564" y="207" font-size="18" text-anchor="start">9 V</text><rect x="720" y="115" width="80" height="30" fill="white" stroke="#225745" stroke-width="3"/><text x="760" y="104" font-size="18" text-anchor="middle">3.0 kΩ</text><path d="M620 130 L680 130" stroke="#225745" stroke-width="3" fill="none"/><circle cx="620" cy="130" r="4"/><circle cx="680" cy="130" r="4"/><text x="490" y="316" font-size="16" text-anchor="start">Find loop current and charge moved in 20 s.</text></g></svg>