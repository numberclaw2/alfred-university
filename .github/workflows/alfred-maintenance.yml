name: Alfred University v16.3.58 Finalizer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/alfred-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alfred-university-maintenance
  cancel-in-progress: false

jobs:
  finalize-v16-3-58:
    runs-on: ubuntu-latest

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm v16.3.58 semantic repair is installed
        shell: bash
        run: |
          set -euo pipefail
          file="v16.3.56-runtime-placement-hotfix.js"
          test -f "$file"
          grep -q "2026-09-23-v16.3.58-semantic-media-integrity" "$file"
          grep -q "ftcCyberBasicsVideo" "$file"
          grep -q "eatonSurgeProtectionVideo" "$file"
          grep -q "nistCyberPowerProtection" "$file"
          grep -q "expected 1021 placements" "$file"
          node --check "$file"

      - name: Harden semantic repair routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          arch_path = Path("teaching-media-architecture-repair.js")
          hotfix_path = Path("v16.3.56-runtime-placement-hotfix.js")
          arch = arch_path.read_text(encoding="utf-8")
          hot = hotfix_path.read_text(encoding="utf-8")

          def extract_balanced(source, marker, opener, closer):
              pos = source.find(marker)
              if pos < 0:
                  raise SystemExit(f"Missing marker: {marker}")
              start = source.find(opener, pos)
              if start < 0:
                  raise SystemExit(f"Missing {opener} after {marker}")
              depth = 0
              in_string = False
              escaped = False
              for i in range(start, len(source)):
                  ch = source[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                      continue
                  if ch == opener:
                      depth += 1
                  elif ch == closer:
                      depth -= 1
                      if depth == 0:
                          return start, i + 1, source[start:i + 1]
              raise SystemExit(f"Unclosed structure after {marker}")

          _, _, p_raw = extract_balanced(arch, "const P=", "{", "}")
          P = json.loads(p_raw)

          r_start, r_end, r_raw = extract_balanced(hot, "const REPAIRS =", "[", "]")
          repairs = json.loads(r_raw)

          blueprint = {
              (int(row[0]), str(row[2])): {"lesson": int(row[1]), "title": str(row[8])}
              for row in P.get("sections", [])
          }

          missing = []
          for repair in repairs:
              key = (int(repair["week"]), str(repair["segment"]))
              meta = blueprint.get(key)
              if not meta:
                  missing.append(key)
                  continue
              repair["lesson"] = meta["lesson"]
              repair["title"] = meta["title"]

          if missing:
              raise SystemExit(
                  "Cannot enrich repair targets: " +
                  ", ".join(f"W{w} {s}" for w, s in missing)
              )

          hot = hot[:r_start] + json.dumps(repairs, indent=2) + hot[r_end:]

          old_function = """  function replaceChannel(week,segment,channel,sources) {
              const rows=placements.filter(p =>
                Number(p.targetWeek)===Number(week) &&
                String(p.segment)===String(segment) &&
                String(p.requirement||'').toLowerCase()==='required' &&
                p.mediaType===channel
              );
              if (!rows.length) throw new Error(`v16.3.58: no ${channel} placement for W${week} ${segment}`);
              if (rows.length !== sources.length) {
                throw new Error(`v16.3.58: count mismatch W${week} ${segment} ${channel}: existing ${rows.length}, repair ${sources.length}`);
              }
              rows.forEach((p,i)=>{
                const source=sources[i];
                p.source=source;
                p.assignmentWeek=assignmentWeekFor(source,week);
                p.relationship='Reinforces this concept';
                p.presentationRole=channel==='video'?'demonstration':'core';
                p.display='primary';
                p.inline=true;
                p.requirement='required';
                p.mediaType=channel;
                p.afterAction=`After using this source, connect it back to the Alfred section and explain the relationship in your own words.`;
                p.reason='v16.3.58 semantic-integrity repair: source selected for direct instructional fit to this section.';
              });
            }"""

          new_function = """  const repairPlacementTitle = p => {
              const text=String(p?.afterAction||'');
              const quoted=text.match(/connect it back to [â"]([^â"]+)[â"]/i);
              return quoted?.[1]||'';
            };

            function replaceChannel(week,segment,channel,sources,lesson,targetTitle) {
              let rows=placements.filter(p =>
                Number(p.targetWeek)===Number(week) &&
                String(p.segment)===String(segment) &&
                String(p.requirement||'').toLowerCase()==='required' &&
                p.mediaType===channel
              );

              if (!rows.length && targetTitle) {
                rows=placements.filter(p =>
                  Number(p.targetWeek)===Number(week) &&
                  (lesson==null || Number(p.lesson)===Number(lesson)) &&
                  String(p.requirement||'').toLowerCase()==='required' &&
                  p.mediaType===channel &&
                  repairPlacementTitle(p)===String(targetTitle)
                );
              }

              if (!rows.length) {
                throw new Error(
                  `v16.3.58: no ${channel} placement for W${week} ${segment}` +
                  (targetTitle ? ` / ${targetTitle}` : '')
                );
              }
              if (rows.length !== sources.length) {
                throw new Error(
                  `v16.3.58: count mismatch W${week} ${segment} ${channel}: ` +
                  `existing ${rows.length}, repair ${sources.length}`
                );
              }

              rows.forEach((p,i)=>{
                const source=sources[i];
                p.source=source;
                p.assignmentWeek=assignmentWeekFor(source,week);
                p.relationship='Reinforces this concept';
                p.presentationRole=channel==='video'?'demonstration':'core';
                p.display='primary';
                p.inline=true;
                p.requirement='required';
                p.mediaType=channel;
                p.afterAction=`After using this source, connect it back to the Alfred section and explain the relationship in your own words.`;
                p.reason='v16.3.58 semantic-integrity repair: source selected for direct instructional fit to this section.';
              });
            }"""

          if old_function in hot:
              hot = hot.replace(old_function, new_function, 1)
          elif "const repairPlacementTitle = p =>" not in hot:
              raise SystemExit("replaceChannel block did not match")

          old_loop = """  REPAIRS.forEach(r=>{
              if (r.video) replaceChannel(r.week,r.segment,'video',r.video);
              if (r.literature) replaceChannel(r.week,r.segment,'literature',r.literature);
            });"""

          new_loop = """  REPAIRS.forEach(r=>{
              if (r.video) replaceChannel(r.week,r.segment,'video',r.video,r.lesson,r.title);
              if (r.literature) replaceChannel(r.week,r.segment,'literature',r.literature,r.lesson,r.title);
            });"""

          if old_loop in hot:
              hot = hot.replace(old_loop, new_loop, 1)
          elif "replaceChannel(r.week,r.segment,'video',r.video,r.lesson,r.title)" not in hot:
              raise SystemExit("REPAIRS loop did not match")

          hotfix_path.write_text(hot, encoding="utf-8")
          PY
          node --check v16.3.56-runtime-placement-hotfix.js

      - name: Finalize v16.3.58 metadata and cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path(".")

          path = root / "build-info.json"
          info = json.loads(path.read_text(encoding="utf-8"))
          info.update({
              "runtimePatch": "16.3.58",
              "build": "v16.3.58-semantic-media-integrity-20260923",
              "releaseStatus": "semantic-media-integrity-repair",
              "teachingMediaRevision": "2026-09-23-v16.3.58-semantic-media-integrity-final",
              "releaseNotesRevision": "2026-09-23-v16.3.58-semantic-media-integrity-final",
              "teachingMediaLessonIntegrationRevision": "2026-09-23-v16.3.58-491-live-section-semantic-repair",
              "teachingMediaResourceIntegrationRevision": "2026-09-23-v16.3.58-semantic-media-integrity-final",
              "teachingMediaAssignmentCount": 347,
              "teachingMediaRetainedAssignmentCount": 347,
              "teachingMediaUniqueSourceCount": 322,
              "teachingMediaInlinePlacementCount": 1021,
              "teachingMediaOrphanCount": 0,
              "teachingMediaCanonicalSourceCount": 319,
              "teachingMediaTargetSectionCount": 491,
              "teachingMediaFinalAcceptanceRevision": "2026-09-23-v16.3.58-runtime-acceptance",
              "teachingMediaFinalAcceptanceVerdict": (
                  "PASS â 491 live sections; 1,021 contextual placements; "
                  "515 written placements; zero missing Required video/written sections; "
                  "zero orphan placements"
              ),
              "teachingMediaArchitectureRevision": "2026-09-23-v16.3.58-semantic-media-integrity-final",
              "teachingMediaUniversalRequiredCount": 251,
              "teachingMediaClassroomAssignmentCount": 251,
              "teachingMediaStudyAssignmentCount": 77,
              "teachingMediaEngineeringLibraryAssignmentCount": 19,
              "teachingMediaWorkloadCalibrationVerdict": (
                  "v16.3.58 verified semantic policy: complete dual-channel coverage for all "
                  "491 live substantive teaching sections; 1,021 contextual placements and "
                  "515 written placements; Week 17 uses separate cyber and surge videos "
                  "because the section contains two distinct protection domains; assignment "
                  "counts remain 251 Classroom / 77 Study / 19 Engineering Library."
              ),
              "contentPlacementBlueprintRevision": "2026-09-23-31-week-491-live-section-semantic-repaired",
              "serviceWorkerRevision": "2026-09-23-v16.3.58-semantic-media-cache-refresh",
              "serviceWorkerInstallIntegrityVerdict": "PASS",
              "teachingMediaSemanticIntegrityRevision": "2026-09-23-v16.3.58-semantic-media-integrity-final",
              "teachingMediaSemanticRepairRuleCount": 210
          })
          path.write_text(json.dumps(info, indent=2) + "\n", encoding="utf-8")

          path = root / "release-notes-current.js"
          text = path.read_text(encoding="utf-8")
          note = {
              "version": "v16.3.58",
              "date": "September 23, 2026",
              "title": "Whole-Course Teaching Media Semantic Integrity Repair",
              "type": "Teaching Media / Contextual Placement / Required vs Study",
              "request": (
                  "Apply the completed Weeks 1â31 adversarial Teaching Media audit without "
                  "redesigning the course or disturbing protected curriculum, labs, "
                  "assessments, CETa, progress IDs, or Cloud Sync."
              ),
              "changes": [
                  "Completed the section-level semantic audit across all 31 weeks and all 491 live substantive teaching sections.",
                  "Applied 210 targeted semantic repair rules to correct over-broad reuse, incomplete first-pass coverage, and source-to-section mismatches while preserving valid canonical reuse.",
                  "Hardened semantic-repair routing so blueprint section IDs normalized by the composed live curriculum resolve by preserved lesson title instead of failing at runtime.",
                  "Corrected hard media-channel defects where written or non-video resources had been occupying Required video slots.",
                  "Added or promoted narrower sources for solder/rework, digital logic, MCU bring-up, Python, cabling/fiber, RF measurement, system bring-up, documentation, portfolio, retention, and other audited gaps.",
                  "Finished Week 17's dual-domain protection section with separate cybersecurity and electrical-surge videos plus a NIST written companion, increasing contextual placements from 1,020 to 1,021 without increasing the 347 assignment total.",
                  "Final runtime acceptance: 491 live sections, 1,021 contextual placements, 515 written placements, zero orphan placements, zero sections missing Required video or written support, and all contextual written placements indexed.",
                  "Preserved 347 assignments: 251 Classroom, 77 Study, and 19 Engineering Library; the repaired inventory contains 322 unique assignment source IDs and 319 canonical source identities after aliases.",
                  "Preserved lesson IDs, assessments, 24 labs, CETa Study Guide integration, 262 CETa competencies, 81 Career standards, progress identity, and Cloud Sync protocol 2.",
                  "Bumped the service-worker cache identity and the loaded semantic-hotfix query on Learn, Study, and Engineering Library to v16.3.58."
              ],
              "filesModified": [
                  "v16.3.56-runtime-placement-hotfix.js",
                  "learn.html",
                  "study.html",
                  "resources.html",
                  "service-worker.js",
                  "build-info.json",
                  "release-notes-current.js",
                  "SHA256SUMS.txt",
                  ".github/workflows/alfred-maintenance.yml"
              ]
          }

          if '"version": "v16.3.58"' not in text:
              marker = "  const entries = [\n"
              if marker not in text:
                  raise SystemExit("release-notes-current.js: entries marker missing")
              payload = "\n".join("    " + line for line in json.dumps(note, indent=2).splitlines())
              text = text.replace(marker, marker + payload + ",\n", 1)

          match = re.search(r"const currentOrder = \[(.*?)\];", text, re.S)
          if not match:
              raise SystemExit("release-notes-current.js: currentOrder not found")
          existing = re.findall(r"'([^']+)'", match.group(1))
          prefix = ["v16.3.58", "v16.3.57", "v16.3.56", "v16.3.55"]
          ordered = prefix + [v for v in existing if v not in prefix]
          replacement = "const currentOrder = [" + ",".join(repr(v) for v in ordered) + "];"
          text = text[:match.start()] + replacement + text[match.end():]
          path.write_text(text, encoding="utf-8")

          path = root / "service-worker.js"
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r"^const CACHE='[^']+';",
              "const CACHE='alfred-u-v16-3-58-semantic-media-integrity-20260923';",
              text, count=1, flags=re.M
          )
          text = re.sub(
              r"v16\.3\.56-runtime-placement-hotfix\.js\?v=[0-9.]+",
              "v16.3.56-runtime-placement-hotfix.js?v=16.3.58",
              text
          )
          path.write_text(text, encoding="utf-8")

          for file_name in ("learn.html", "study.html", "resources.html"):
              path = root / file_name
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r"v16\.3\.56-runtime-placement-hotfix\.js\?v=[0-9.]+",
                  "v16.3.56-runtime-placement-hotfix.js?v=16.3.58",
                  text
              )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Verify references and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import re

          root=Path(".")
          missing=[]
          for html in sorted(root.glob("*.html")):
              text=html.read_text(encoding="utf-8",errors="ignore")
              for value in re.findall(r'(?:href|src)=["\']([^"\']+)["\']',text,re.I):
                  if re.match(r'^(?:https?:|mailto:|tel:|data:|javascript:|#)',value,re.I):
                      continue
                  target=unquote(value.split("?",1)[0].split("#",1)[0])
                  if target and not (root/target).exists():
                      missing.append(f"{html.name}: {value}")
          if missing:
              raise SystemExit("Missing local HTML references:\n"+"\n".join(missing))

          sw=(root/"service-worker.js").read_text(encoding="utf-8")
          match=re.search(r"const CORE=\[(.*?)\];",sw,re.S)
          if not match:
              raise SystemExit("service-worker.js CORE list not found")
          missing_core=[]
          for value in re.findall(r"'([^']+)'",match.group(1)):
              if value=="./":
                  continue
              target=unquote(value.split("?",1)[0].split("#",1)[0])
              if target and not (root/target).exists():
                  missing_core.append(value)
          if missing_core:
              raise SystemExit("Service-worker CORE contains missing assets:\n"+"\n".join(missing_core))
          PY
          for file in ./*.js; do
            node --check "$file"
          done

      - name: Execute composed AU-ESET 301 runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/alfred-runtime-audit.cjs <<'NODE'
          const fs=require('fs'),vm=require('vm'),path=require('path');
          const root=process.cwd();

          const documentStub={
            addEventListener(){},querySelector(){return null},querySelectorAll(){return[]},
            getElementById(){return null},createElement(){return{}},
            body:{},documentElement:{classList:{add(){},remove(){}}}
          };
          const storage={getItem(){return null},setItem(){},removeItem(){}};
          const context={
            console,window:{},document:documentStub,localStorage:storage,sessionStorage:storage,
            navigator:{userAgent:'github-actions-audit'},
            location:{href:'https://example.invalid/learn.html',pathname:'/learn.html',search:'',hash:''},
            URL,URLSearchParams,TextEncoder,TextDecoder,
            setTimeout,clearTimeout,setInterval,clearInterval,
            structuredClone:global.structuredClone,crypto:global.crypto
          };
          context.window.addEventListener=()=>{};
          context.window.removeEventListener=()=>{};
          context.window.dispatchEvent=()=>true;
          context.window.window=context.window;
          Object.assign(context.window,{
            document:documentStub,localStorage:storage,sessionStorage:storage,
            navigator:context.navigator,location:context.location
          });
          vm.createContext(context);

          const files=[
            'course-data.js','academic-content.js','curriculum-data.js',
            'teaching-media-overrides.js','teaching-media-self-reliance.js',
            'teaching-media-content-completion.js','week1-beginner-teaching-media.js',
            'assessment-data.js','assessment-completion.js','semantic-repair.js',
            'week1-instructional-depth.js','career-instructional-depth.js',
            'career-curriculum-reconstruction.js','instructional-visuals.js',
            'career-traceability-routing.js','teaching-media-resource-integration.js',
            'outside-literature-integration.js','teaching-media-architecture-repair.js',
            'v16.3.56-runtime-placement-hotfix.js','ceta-study-guide-map.js',
            'ceta-study-guide-private.js','media-consumption.js','academic-state.js'
          ];

          for(const file of files){
            vm.runInContext(fs.readFileSync(path.join(root,file),'utf8'),context,{filename:file,timeout:10000});
          }

          const w=context.window;
          const C=w.ALFRED_CURRICULUM||{};
          const R=C.teachingResourceIntegration||{};
          const A=C.teachingMediaArchitecture||{};
          const O=C.outsideLiteratureIntegration||{};
          const placements=R.placements||[];

          const live=[];
          for(const module of C.modules||[]){
            for(let lessonIndex=0;lessonIndex<(module.lessons||[]).length;lessonIndex++){
              const teaching=module.lessons?.[lessonIndex]?.integrated?.teaching||[];
              for(let i=0;i<teaching.length;i++){
                const section=teaching[i];
                if(section?.hiddenFromLesson)continue;
                live.push({
                  week:Number(module.week),lesson:lessonIndex,
                  segment:String(section?.sectionId||`concept-${i+1}`)
                });
              }
            }
          }

          const liveKeys=new Set(live.map(x=>`${x.week}:${x.lesson}:${x.segment}`));
          const placementKey=p=>`${Number(p.targetWeek)}:${Number(p.lesson)}:${String(p.segment)}`;
          const orphan=placements.filter(p=>!liveKeys.has(placementKey(p)));

          const missingVideo=[];
          const missingLiterature=[];
          for(const section of live){
            const key=`${section.week}:${section.lesson}:${section.segment}`;
            const rows=placements.filter(
              p=>placementKey(p)===key && String(p.requirement||'').toLowerCase()==='required'
            );
            if(!rows.some(p=>p.mediaType==='video'))missingVideo.push(key);
            if(!rows.some(p=>p.mediaType==='literature'))missingLiterature.push(key);
          }

          const literature=placements.filter(p=>p.mediaType==='literature');
          const litKey=p=>`${p.assignmentWeek}:${p.source}:${p.targetWeek}:${p.lesson}:${p.segment}`;
          const missingLitMeta=literature.filter(p=>!O.byPlacement?.[litKey(p)]);

          const assignments=Object.values(A.assignments||{});
          const destinations=assignments.reduce((m,a)=>{
            m[a.destination]=(m[a.destination]||0)+1;return m;
          },{});

          const mediaTypeMismatches=placements.filter(p=>{
            const declared=C.sources?.[p.source]?.medium;
            if(!declared)return false;
            if(p.mediaType==='video')return declared!=='video';
            if(p.mediaType==='literature')return declared!=='literature';
            return false;
          });

          function assert(value,message){if(!value)throw new Error(message);}

          assert((C.modules||[]).length===31,'Expected 31 modules');
          assert(live.length===491,`Expected 491 live sections, found ${live.length}`);
          assert(placements.length===1021,`Expected 1,021 placements, found ${placements.length}`);
          assert(literature.length===515,`Expected 515 literature placements, found ${literature.length}`);
          assert(orphan.length===0,`Found ${orphan.length} orphan placements`);
          assert(missingVideo.length===0,`Found ${missingVideo.length} sections missing Required video`);
          assert(missingLiterature.length===0,`Found ${missingLiterature.length} sections missing Required literature`);
          assert(missingLitMeta.length===0,`Found ${missingLitMeta.length} literature placements without reading metadata`);
          assert(mediaTypeMismatches.length===0,`Found ${mediaTypeMismatches.length} media-type mismatches`);

          assert(assignments.length===347,`Expected 347 assignments, found ${assignments.length}`);
          assert(destinations.classroom===251,'Expected 251 Classroom assignments');
          assert(destinations.study===77,'Expected 77 Study assignments');
          assert(destinations.library===19,'Expected 19 Engineering Library assignments');
          assert(new Set(assignments.map(a=>a.source)).size===322,'Expected 322 unique assignment source IDs');
          assert(R.canonicalSourceCount===319,`Expected 319 canonical source identities, found ${R.canonicalSourceCount}`);

          const week4=(C.modules||[]).find(m=>Number(m.week)===4)?.lessons?.[0]?.integrated?.teaching||[];
          assert(
            week4.find(s=>s?.title==='Number systems and Boolean algebra')?.hiddenFromLesson===true,
            'Week 4 legacy Number Systems / Boolean Algebra section is visible'
          );

          assert(w.ALFRED_ACADEMIC?.labs?.length===24,'Expected 24 labs');
          assert(w.ALFRED_ASSESSMENT?.cetaStandards?.length===262,'Expected 262 CETa standards');
          assert(w.ALFRED_ASSESSMENT?.careerStandards?.length===81,'Expected 81 Career standards');
          assert(w.ALFRED_ASSESSMENT?.weeklyTests?.length===31,'Expected 31 weekly mastery tests');

          const guide=w.ALFRED_CETA_STUDY_GUIDE||{};
          assert(guide.requiredPageCount===64,'Expected 64 Required CETa Study Guide pages');
          assert(guide.dispositionCounts?.study===133,'Expected 133 Study/Review CETa Study Guide pages');
          assert(guide.dispositionCounts?.reference===27,'Expected 27 Reference/Historical CETa Study Guide pages');
          assert((guide.requiredWeeks||[]).length===14,'Expected 14 CETa Study Guide Required weeks');
          assert((guide.zeroNewRequiredWeeks||[]).length===17,'Expected 17 zero-new-Required weeks');

          const info=JSON.parse(fs.readFileSync(path.join(root,'build-info.json'),'utf8'));
          assert(info.courseRelease==='16.3','Course release changed unexpectedly');
          assert(info.runtimePatch==='16.3.58','Runtime patch is not v16.3.58');
          assert(info.evidenceRevision==='16.2','Evidence revision changed unexpectedly');
          assert(info.cloudSyncProtocol===2,'Cloud Sync protocol changed unexpectedly');

          const MC=w.AlfredMediaConsumption||{};
          assert(
            MC.mediaId(9,'aacPowerSupplies')===MC.mediaId(9,'aacPowerSuppliesApplications'),
            'Power-supply duplicate video does not share one completion identity'
          );
          assert(
            MC.mediaId(10,'aacAmpConfigs')===MC.mediaId(10,'aacAmplifierConfigs'),
            'Amplifier-config duplicate video does not share one completion identity'
          );
          assert(
            MC.mediaId(22,'litNasaSystemsAppendix')===MC.mediaId(22,'nasaRequirementAppendix'),
            'NASA duplicate literature does not share one completion identity'
          );

          console.log('AU-ESET 301 v16.3.58 runtime audit PASS');
          console.log(JSON.stringify({
            liveSections:live.length,
            placements:placements.length,
            literaturePlacements:literature.length,
            orphanCount:orphan.length,
            missingVideo:missingVideo.length,
            missingLiterature:missingLiterature.length,
            missingLiteratureMetadata:missingLitMeta.length,
            mediaTypeMismatches:mediaTypeMismatches.length,
            assignments:assignments.length,
            destinations,
            uniqueAssignmentSourceIds:new Set(assignments.map(a=>a.source)).size,
            canonicalSourceIds:R.canonicalSourceCount
          },null,2));
          NODE
          node /tmp/alfred-runtime-audit.cjs

      - name: Rebuild current checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root=Path(".")
          files=[
              "build-info.json","learn.html","media-consumption.js",
              "release-notes-current.js","resources.html","service-worker.js",
              "study.html","teaching-media-resource-integration.js",
              "v16.3.56-runtime-placement-hotfix.js"
          ]
          lines=[]
          for file_name in files:
              path=root/file_name
              if not path.is_file():
                  raise SystemExit(f"Checksum target missing: {file_name}")
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {file_name}")
          (root/"SHA256SUMS.txt").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY

      - name: Commit and push finalized v16.3.58
        shell: bash
        run: |
          set -euo pipefail
          git add v16.3.56-runtime-placement-hotfix.js \
                  build-info.json \
                  release-notes-current.js \
                  service-worker.js \
                  learn.html \
                  study.html \
                  resources.html \
                  SHA256SUMS.txt

          if git diff --cached --quiet; then
            echo "v16.3.58 is already finalized."
            exit 0
          fi

          git config user.name "AU-ESET 301 Maintenance Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Finalize AU-ESET 301 v16.3.58 semantic media repair"
          git push origin HEAD:main
