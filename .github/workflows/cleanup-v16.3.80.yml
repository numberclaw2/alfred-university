name: Alfred v16.3.80 Safe Repository Cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-v16.3.80.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alfred-v16-3-80-safe-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message || '', '[cleanup-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify accepted v16.3.80 baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          info = json.loads(Path('build-info.json').read_text(encoding='utf-8'))
          assert info.get('runtimePatch') == '16.3.80', info.get('runtimePatch')
          assert info.get('cloudSyncProtocol') == 2, info.get('cloudSyncProtocol')
          assert info.get('careerStandardCount') == 95, info.get('careerStandardCount')
          assert info.get('currentSemanticCoverageCetaCount') == 262
          assert info.get('currentSemanticCoverageCareerCount') == 95
          assert info.get('currentSemanticCoverageTotalCount') == 357
          print('Accepted v16.3.80 baseline confirmed.')
          PY

      - name: Remove obsolete deployment helpers and one-off tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch -- \
            '00_UPLOAD_FIRST.txt' \
            '00_V13_1_REPLACE_INSTRUCTIONS.txt' \
            '00_V16_3_1_GITHUB_HOTFIX_UPLOAD.txt' \
            'Alfred_v15_UPLOAD_INSTRUCTIONS.txt' \
            'UPLOAD-INSTRUCTIONS.txt' \
            'UPLOAD_INSTRUCTIONS_v11.txt' \
            'README_APPLY_v16.3.56.md' \
            'README Readability Fix v16.3.67.txt' \
            'V14-VALIDATION.txt' \
            'V14.1-VALIDATION.txt' \
            'V14.2-VALIDATION.txt' \
            'AU-ESET-301-v16.3.58-maintenance.patch' \
            'AU-ESET-301-v16.3.58-patch-b64.txt' \
            'build-info.json.patch' \
            'learn.html.patch' \
            'service-worker.js.patch' \
            'apply_v16_3_56_patch.py' \
            'apply_v16_3_61_builtin_study_guide.py' \
            'fetch_library.py' \
            'Teaching_Media_Patch.js' \
            'behavior.cjs' \
            'regression.cjs' \
            '.github/workflows/apply-v16.3.56.yml' \
            '.github/workflows/alfred-maintenance'

      - name: Remove stale checksum rows for deleted files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('SHA256SUMS.txt')
          if not p.exists():
              raise SystemExit('SHA256SUMS.txt is missing')
          removed = {
              '00_UPLOAD_FIRST.txt',
              '00_V13_1_REPLACE_INSTRUCTIONS.txt',
              '00_V16_3_1_GITHUB_HOTFIX_UPLOAD.txt',
              'Alfred_v15_UPLOAD_INSTRUCTIONS.txt',
              'UPLOAD-INSTRUCTIONS.txt',
              'UPLOAD_INSTRUCTIONS_v11.txt',
              'README_APPLY_v16.3.56.md',
              'README Readability Fix v16.3.67.txt',
              'V14-VALIDATION.txt',
              'V14.1-VALIDATION.txt',
              'V14.2-VALIDATION.txt',
              'AU-ESET-301-v16.3.58-maintenance.patch',
              'AU-ESET-301-v16.3.58-patch-b64.txt',
              'build-info.json.patch',
              'learn.html.patch',
              'service-worker.js.patch',
              'apply_v16_3_56_patch.py',
              'apply_v16_3_61_builtin_study_guide.py',
              'fetch_library.py',
              'Teaching_Media_Patch.js',
              'behavior.cjs',
              'regression.cjs',
              'artifact.tar',
          }
          kept = []
          dropped = []
          for raw in p.read_text(encoding='utf-8').splitlines():
              parts = raw.split('  ', 1)
              filename = parts[1] if len(parts) == 2 else None
              if filename in removed:
                  dropped.append(filename)
              else:
                  kept.append(raw)
          p.write_text('\n'.join(kept) + '\n', encoding='utf-8')
          print(f'Removed {len(dropped)} stale checksum rows.')
          PY
          git add SHA256SUMS.txt

      - name: Verify deleted files are not service-worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          deleted=(
            '00_UPLOAD_FIRST.txt'
            '00_V13_1_REPLACE_INSTRUCTIONS.txt'
            '00_V16_3_1_GITHUB_HOTFIX_UPLOAD.txt'
            'Alfred_v15_UPLOAD_INSTRUCTIONS.txt'
            'UPLOAD-INSTRUCTIONS.txt'
            'UPLOAD_INSTRUCTIONS_v11.txt'
            'README_APPLY_v16.3.56.md'
            'README Readability Fix v16.3.67.txt'
            'V14-VALIDATION.txt'
            'V14.1-VALIDATION.txt'
            'V14.2-VALIDATION.txt'
            'AU-ESET-301-v16.3.58-maintenance.patch'
            'AU-ESET-301-v16.3.58-patch-b64.txt'
            'build-info.json.patch'
            'learn.html.patch'
            'service-worker.js.patch'
            'apply_v16_3_56_patch.py'
            'apply_v16_3_61_builtin_study_guide.py'
            'fetch_library.py'
            'Teaching_Media_Patch.js'
            'behavior.cjs'
            'regression.cjs'
          )
          for file in "${deleted[@]}"; do
            if grep -Fq "$file" service-worker.js; then
              echo "BLOCKED: service-worker.js still references $file"
              exit 1
            fi
          done
          echo 'No deleted file is a service-worker runtime dependency.'

      - name: Run current CETa authority and site integrity QA
        shell: bash
        run: |
          set -euo pipefail
          node ceta-instructional-authority-qa-v16.3.80.cjs .

      - name: Confirm governing files remain intact
        shell: bash
        run: |
          set -euo pipefail
          test -f 'AU-ESET-301-v16.3.77-Career-Occupational-Standards-and-Governance.md'
          test -f 'AU-ESET-301-v16.3.80-CETa-Instructional-Authority-Map.csv'
          test -f 'AU-ESET-301-v16.3.80-CETa-Route-Rehome-Backlog.csv'
          test -f 'AU-ESET-301-v16.3.80-CETa-Career-Tandem-Dependency-Graph.csv'
          test -f 'AU-ESET-301-v16.3.80-Three-Gate-Week-Acceptance.csv'
          test -f 'course-data.js'
          test -f 'curriculum-data.js'
          test -f 'service-worker.js'
          test -f 'index.html'

      - name: Commit cleanup and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch '.github/workflows/cleanup-v16.3.80.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to clean.'
            exit 0
          fi
          git commit -m 'chore: remove obsolete Alfred deployment helpers [cleanup-complete]'
          git push origin HEAD:main
