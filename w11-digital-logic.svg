<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">w11 digital logic</title><desc id="d">Instructional diagram for w11 digital logic.</desc><rect width="1000" height="360" rx="18" fill="#fbf8ef"/><rect x="18" y="18" width="964" height="324" rx="14" fill="none" stroke="#0b4f38" stroke-width="3"/><text x="55" y="65" font-family="Arial" font-size="23" font-weight="700" fill="#0b4f38">W11 Digital Logic</text><text x="70" y="110" font-family="Arial" font-size="16" font-weight="700" fill="#16322a">Inputs A,B</text><line x1="300" y1="104" x2="900" y2="104" stroke="#d6dfda" stroke-width="2"/><rect x="390" y="85" width="110" height="38" rx="18" fill="#fff" stroke="#0b4f38" stroke-width="2"/><text x="445" y="110" text-anchor="middle" font-family="Arial" font-size="15">LOGIC</text><line x1="500" y1="104" x2="800" y2="104" stroke="#c8a951" stroke-width="4"/><text x="330" y="135" font-family="Arial" font-size="13" fill="#65766f">truth table</text><text x="70" y="164" font-family="Arial" font-size="16" font-weight="700" fill="#16322a">AND / OR / XOR</text><line x1="300" y1="158" x2="900" y2="158" stroke="#d6dfda" stroke-width="2"/><rect x="390" y="139" width="110" height="38" rx="18" fill="#fff" stroke="#0b4f38" stroke-width="2"/><text x="445" y="164" text-anchor="middle" font-family="Arial" font-size="15">LOGIC</text><line x1="500" y1="158" x2="800" y2="158" stroke="#c8a951" stroke-width="4"/><text x="330" y="189" font-family="Arial" font-size="13" fill="#65766f">Boolean relation</text><text x="70" y="218" font-family="Arial" font-size="16" font-weight="700" fill="#16322a">Flip-flop</text><line x1="300" y1="212" x2="900" y2="212" stroke="#d6dfda" stroke-width="2"/><rect x="390" y="193" width="110" height="38" rx="18" fill="#fff" stroke="#0b4f38" stroke-width="2"/><text x="445" y="218" text-anchor="middle" font-family="Arial" font-size="15">LOGIC</text><line x1="500" y1="212" x2="800" y2="212" stroke="#c8a951" stroke-width="4"/><text x="330" y="243" font-family="Arial" font-size="13" fill="#65766f">stored state</text><text x="70" y="272" font-family="Arial" font-size="16" font-weight="700" fill="#16322a">Clock</text><line x1="300" y1="266" x2="900" y2="266" stroke="#d6dfda" stroke-width="2"/><rect x="390" y="247" width="110" height="38" rx="18" fill="#fff" stroke="#0b4f38" stroke-width="2"/><text x="445" y="272" text-anchor="middle" font-family="Arial" font-size="15">LOGIC</text><line x1="500" y1="266" x2="800" y2="266" stroke="#c8a951" stroke-width="4"/><text x="330" y="297" font-family="Arial" font-size="13" fill="#65766f">edge updates</text><text x="500" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#65766f">Use the labels to explain cause → observation, not just memorize the picture.</text></svg>