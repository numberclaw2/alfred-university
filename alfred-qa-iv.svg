<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Current versus voltage measurements</title><desc id="d">Current in milliamperes on the vertical axis and voltage in volts on the horizontal axis. Points are 2 volts 4 milliamperes, 4 volts 8 milliamperes, and 6 volts 9 milliamperes.</desc><rect width="900" height="360" rx="16" fill="#f5f8f6"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#225745"/></marker></defs><g font-family="Arial,sans-serif" fill="#193c32"><text x="25" y="32" font-size="22" text-anchor="start">Measured I–V points — test a constant resistance model</text><path d="M130 70 L130 270" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="130" y="295" font-size="16" text-anchor="middle">0</text><path d="M220 70 L220 270" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="220" y="295" font-size="16" text-anchor="middle">1</text><path d="M310 70 L310 270" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="310" y="295" font-size="16" text-anchor="middle">2</text><path d="M400 70 L400 270" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="400" y="295" font-size="16" text-anchor="middle">3</text><path d="M490 70 L490 270" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="490" y="295" font-size="16" text-anchor="middle">4</text><path d="M580 70 L580 270" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="580" y="295" font-size="16" text-anchor="middle">5</text><path d="M670 70 L670 270" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="670" y="295" font-size="16" text-anchor="middle">6</text><path d="M130 270 L670 270" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="110" y="275" font-size="16" text-anchor="end">0</text><path d="M130 240 L670 240" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="110" y="245" font-size="16" text-anchor="end">2</text><path d="M130 210 L670 210" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="110" y="215" font-size="16" text-anchor="end">4</text><path d="M130 180 L670 180" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="110" y="185" font-size="16" text-anchor="end">6</text><path d="M130 150 L670 150" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="110" y="155" font-size="16" text-anchor="end">8</text><path d="M130 120 L670 120" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="110" y="125" font-size="16" text-anchor="end">10</text><path d="M130 90 L670 90" stroke="#d1ded7" stroke-width="3" fill="none"/><text x="110" y="95" font-size="16" text-anchor="end">12</text><path d="M130 270 L700 270" stroke="#225745" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M130 270 L130 62" stroke="#225745" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="720" y="277" font-size="18" text-anchor="start">V (volts)</text><text x="28" y="62" font-size="18" text-anchor="start">I (mA)</text><path d="M310 210 L490 150 L670 135" fill="none" stroke="#147660" stroke-width="3"/><circle cx="310" cy="210" r="6" fill="#147660"/><text x="300" y="196" font-size="16" text-anchor="end">2 V, 4 mA</text><circle cx="490" cy="150" r="6" fill="#147660"/><text x="480" y="136" font-size="16" text-anchor="end">4 V, 8 mA</text><circle cx="670" cy="135" r="6" fill="#147660"/><text x="660" y="121" font-size="16" text-anchor="end">6 V, 9 mA</text><text x="30" y="335" font-size="18" text-anchor="start">Compute V/I at every point. Give the units of the slope on these axes.</text></g></svg>