<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Calibrated pulse graticule</title><desc id="d">Pulse trace switches between zero and 3.3 volts. Grid is 100 microseconds per division and one volt per division. High pulses extend from 0 to 80, 400 to 480, and 800 to 880 microseconds. A rising-edge trigger reference is 1.5 volts.</desc><rect width="900" height="360" rx="16" fill="#f5f8f6"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#225745"/></marker></defs><g font-family="Arial,sans-serif" fill="#193c32"><text x="25" y="32" font-size="22" text-anchor="start">Calibrated teaching trace — read the graticule</text><path d="M100 80 L100 240" stroke="#cfddd5" stroke-width="3" fill="none"/><text x="100" y="266" font-size="15" text-anchor="middle">0</text><path d="M160 80 L160 240" stroke="#cfddd5" stroke-width="3" fill="none"/><path d="M220 80 L220 240" stroke="#cfddd5" stroke-width="3" fill="none"/><text x="220" y="266" font-size="15" text-anchor="middle">200</text><path d="M280 80 L280 240" stroke="#cfddd5" stroke-width="3" fill="none"/><path d="M340 80 L340 240" stroke="#cfddd5" stroke-width="3" fill="none"/><text x="340" y="266" font-size="15" text-anchor="middle">400</text><path d="M400 80 L400 240" stroke="#cfddd5" stroke-width="3" fill="none"/><path d="M460 80 L460 240" stroke="#cfddd5" stroke-width="3" fill="none"/><text x="460" y="266" font-size="15" text-anchor="middle">600</text><path d="M520 80 L520 240" stroke="#cfddd5" stroke-width="3" fill="none"/><path d="M580 80 L580 240" stroke="#cfddd5" stroke-width="3" fill="none"/><text x="580" y="266" font-size="15" text-anchor="middle">800</text><path d="M640 80 L640 240" stroke="#cfddd5" stroke-width="3" fill="none"/><path d="M700 80 L700 240" stroke="#cfddd5" stroke-width="3" fill="none"/><text x="700" y="266" font-size="15" text-anchor="middle">1000</text><path d="M100 240 L700 240" stroke="#cfddd5" stroke-width="3" fill="none"/><text x="84" y="245" font-size="16" text-anchor="end">0</text><path d="M100 200 L700 200" stroke="#cfddd5" stroke-width="3" fill="none"/><text x="84" y="205" font-size="16" text-anchor="end">1</text><path d="M100 160 L700 160" stroke="#cfddd5" stroke-width="3" fill="none"/><text x="84" y="165" font-size="16" text-anchor="end">2</text><path d="M100 120 L700 120" stroke="#cfddd5" stroke-width="3" fill="none"/><text x="84" y="125" font-size="16" text-anchor="end">3</text><path d="M100 80 L700 80" stroke="#cfddd5" stroke-width="3" fill="none"/><text x="84" y="85" font-size="16" text-anchor="end">4</text><text x="48" y="65" font-size="18" text-anchor="start">V</text><text x="724" y="248" font-size="18" text-anchor="start">µs</text><text x="735" y="100" font-size="17" text-anchor="start">100 µs/div</text><text x="735" y="129" font-size="17" text-anchor="start">1 V/div</text><path d="M100 240 V108 H148 V240 H340 V108 H388 V240 H580 V108 H628 V240 H700" stroke="#147660" stroke-width="4" fill="none"/><path d="M100 180 H700" stroke="#bd780a" stroke-width="2" stroke-dasharray="6 5"/><text x="735" y="182" font-size="16" text-anchor="start">1.5 V trigger</text><text x="30" y="305" font-size="17" text-anchor="start">Physical 10× probe and channel 10× setting match. The display is calibrated.</text><text x="30" y="337" font-size="18" text-anchor="start">Find pulse width, period, frequency and duty cycle from the axes.</text></g></svg>